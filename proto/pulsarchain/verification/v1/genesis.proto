syntax = "proto3";
package pulsarchain.verification.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "pulsarchain/verification/v1/params.proto";

option go_package = "github.com/node101-io/pulsar-chain/x/verification/types";

// GenesisState defines the verification module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
