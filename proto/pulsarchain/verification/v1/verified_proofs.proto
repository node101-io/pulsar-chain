syntax = "proto3";
package pulsarchain.verification.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "pulsarchain/verification/v1/proof_commitment.proto";

option go_package = "github.com/node101-io/pulsar-chain/x/verification/types";

message VerifiedProofs {
   repeated ProofCommitment first_block_proofs = 1;
   repeated ProofCommitment second_block_proofs = 2;
}