syntax = "proto3";

package pulsarchain.verification.v1;

import "gogoproto/gogo.proto";
import "pulsarchain/verification/v1/proof_commitment.proto";

option go_package = "github.com/node101-io/pulsar-chain/x/verification/types";

// ProofCommitmentReveal opens the left leaf and supplies the right sibling.
message ProofCommitmentReveal {
  bytes first_secret_salt = 1;

  repeated ProofCommitment first_block_proofs = 2
      [(gogoproto.nullable) = false];

  bytes second_leaf_hash = 3;
}