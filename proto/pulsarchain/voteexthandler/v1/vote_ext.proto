syntax = "proto3";
package pulsarchain.voteexthandler.v1;

option go_package = "github.com/node101-io/pulsar-chain/x/voteexthandler/types";

// VoteExtBody defines the VoteExtBody message.
message VoteExt {
  string index = 1; 
  uint64 height = 2; 
  string validator_addr = 3; 
  string signature = 4; 
}

// Height-based index mapping
message VoteExtIndex {
  uint64 height = 1;
  repeated string indexes = 2; // Array of VoteExt indexes for this height
}

