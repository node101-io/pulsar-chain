syntax = "proto3";

package pulsarchain.keyregistry.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "pulsarchain/keyregistry/v1/params.proto";

option go_package = "github.com/node101-io/pulsar-chain/x/keyregistry/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // RegisterUserKeys associates the transaction signer's stable Cosmos key with a Mina key.
  rpc RegisterUserKeys(MsgRegisterUserKeys) returns (MsgRegisterUserKeysResponse);
  // UpdateUserKeys replaces a registered user's Mina key.
  rpc UpdateUserKeys(MsgUpdateUserKeys) returns (MsgUpdateUserKeysResponse);
  // RegisterValidatorKeys associates a validator consensus key with a Mina key.
  rpc RegisterValidatorKeys(MsgRegisterValidatorKeys) returns (MsgRegisterValidatorKeysResponse);
  // UpdateValidatorKeys replaces a registered validator's Mina key.
  rpc UpdateValidatorKeys(MsgUpdateValidatorKeys) returns (MsgUpdateValidatorKeysResponse);
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "pulsarchain/x/keyregistry/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.

  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgRegisterUserKeys creates a user key association authorized by the Cosmos
// transaction signer and the Mina key owner.
message MsgRegisterUserKeys {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes cosmos_public_key = 2;
  bytes mina_public_key = 3;
  bytes mina_signature = 4;
}

// MsgRegisterUserKeysResponse is returned after a successful user registration.
message MsgRegisterUserKeysResponse {}

// MsgUpdateUserKeys rotates a user's Mina key at the requested version.
message MsgUpdateUserKeys {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes cosmos_public_key = 2;
  bytes new_mina_public_key = 3;
  uint64 new_key_version = 4;
  bytes new_mina_signature = 5;
}

// MsgUpdateUserKeysResponse is returned after a successful user key update.
message MsgUpdateUserKeysResponse {}

// MsgRegisterValidatorKeys creates a validator key association authorized by
// the validator consensus key and the Mina key owner.
message MsgRegisterValidatorKeys {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes validator_consensus_public_key = 2;
  bytes mina_public_key = 3;
  bytes mina_signature = 4;
  bytes validator_consensus_signature = 5;
}

// MsgRegisterValidatorKeysResponse is returned after a successful validator registration.
message MsgRegisterValidatorKeysResponse {}

// MsgUpdateValidatorKeys rotates a validator's Mina key at the requested version.
message MsgUpdateValidatorKeys {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes validator_consensus_public_key = 2;
  bytes new_mina_public_key = 3;
  uint64 new_key_version = 4;
  bytes new_mina_signature = 5;
  bytes validator_consensus_signature = 6;
}

// MsgUpdateValidatorKeysResponse is returned after a successful validator key update.
message MsgUpdateValidatorKeysResponse {}
