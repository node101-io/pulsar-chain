syntax = "proto3";
package pulsarchain.smartaccounts.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/node101-io/pulsar-chain/x/smartaccounts/types";

message SmartAccount {
  repeated SessionKey session_keys = 1 [(gogoproto.nullable) = false];
}

message SessionKey {
  bytes public_key = 1;
  uint64 expires_at_height = 2;
}