syntax = "proto3";

package pulsarchain.bridge.v1;

import "amino/amino.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "pulsarchain/bridge/v1/params.proto";

option go_package = "github.com/node101-io/pulsar-chain/x/bridge/types";

// Query defines the gRPC querier service.
service Query {
  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/node101-io/pulsar-chain/bridge/v1/params";
  }

  // ActionsReducedRoot Queries a list of ActionsReducedRoot items.
  rpc ActionsReducedRoot(QueryActionsReducedRootRequest) returns (QueryActionsReducedRootResponse) {
    option (google.api.http).get = "/node101-io/pulsar-chain/bridge/v1/actions_reduced_root";
  }

  // LatestActionHashes Queries a list of LatestActionHashes items.
  rpc LatestActionHashes(QueryLatestActionHashesRequest) returns (QueryLatestActionHashesResponse) {
    option (google.api.http).get = "/node101-io/pulsar-chain/bridge/v1/latest_action_hashes";
  }
}

// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryActionsReducedRootRequest defines the QueryActionsReducedRootRequest message.
message QueryActionsReducedRootRequest {}

// QueryActionsReducedRootResponse defines the QueryActionsReducedRootResponse message.
message QueryActionsReducedRootResponse {
  string actions_reduced_root = 1;
}

// QueryLatestActionHashesRequest defines the QueryLatestActionHashesRequest message.
message QueryLatestActionHashesRequest {}

// QueryLatestActionHashesResponse defines the QueryLatestActionHashesResponse message.
message QueryLatestActionHashesResponse {
  // latest_fetched_mina_height is the inclusive upper Mina cursor of the
  // current batch. Together with start_mina_height it defines the consumed
  // Mina interval (start_mina_height, latest_fetched_mina_height].
  int64 latest_fetched_mina_height = 1;

  // action_hashes is the ordered canonical hash batch that reconstructs
  // the root transition for the source Cosmos block.
  repeated string action_hashes = 2;

  // start_mina_height is the exclusive lower Mina cursor of the current batch.
  int64 start_mina_height = 3;

  // action_hashes_cosmos_block_height is the Cosmos block height where
  // this query batch was produced.
  int64 action_hashes_cosmos_block_height = 4;
}
