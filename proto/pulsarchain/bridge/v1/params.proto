syntax = "proto3";
package pulsarchain.bridge.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/node101-io/pulsar-chain/x/bridge/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "pulsarchain/x/bridge/Params";
  option (gogoproto.equal) = true;
}
