syntax = "proto3";
package pulsarchain.bridge.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/node101-io/pulsar-chain/x/bridge/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "pulsarchain/x/bridge/Params";
  option (gogoproto.equal) = true;

  int64 confirmation_depth = 1;
  string contract_address = 2;
  int64 start_block_height = 3;
  int64 max_block_range = 4;
}
