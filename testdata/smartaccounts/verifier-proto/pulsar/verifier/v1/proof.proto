syntax = "proto3";

package pulsar.verifier.v1;

import "pulsarchain/verification/v1/types.proto";

// Proof carries every artifact required for independent verification.
message Proof {
  pulsarchain.verification.v1.ProofType proof_type = 1;
  bytes proof = 2;
  bytes public_inputs = 3;
  bytes verification_key = 4;
}
