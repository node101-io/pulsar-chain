name: Unit tests
on:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Tests
        run: |
          make test
  vote-extension-verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/vote-ext-verifier
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/vote-ext-verifier/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Tests
        run: npm test
