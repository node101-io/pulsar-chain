x-pulsar-image: &pulsar-image
  image: ${PULSAR_DOCKER_IMAGE:-pulsar-chain:local}

x-pulsar-build: &pulsar-build
  build:
    context: .
    dockerfile: Dockerfile

services:
  setup:
    <<: [*pulsar-image, *pulsar-build]
    command: ["setup-local-testnet", "3"]
    restart: "no"
    volumes:
      - validator1_data:/testnet/.pulsar-node1
      - validator2_data:/testnet/.pulsar-node2
      - validator3_data:/testnet/.pulsar-node3

  validator1:
    <<: *pulsar-image
    command: ["start-validator", "1"]
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - validator1_data:/testnet/.pulsar-node1
    ports:
      - host_ip: "${PULSAR_BIND_HOST:-127.0.0.1}"
        target: 26657
        published: "${VALIDATOR1_HOST_RPC_PORT:-26657}"
        protocol: tcp
      - host_ip: "${PULSAR_BIND_HOST:-127.0.0.1}"
        target: 1317
        published: "${VALIDATOR1_HOST_API_PORT:-1317}"
        protocol: tcp
      - host_ip: "${PULSAR_BIND_HOST:-127.0.0.1}"
        target: 9090
        published: "${VALIDATOR1_HOST_GRPC_PORT:-9090}"
        protocol: tcp
      - host_ip: "${PULSAR_BIND_HOST:-127.0.0.1}"
        target: 6060
        published: "${VALIDATOR1_HOST_PPROF_PORT:-6060}"
        protocol: tcp
    healthcheck:
      test: ["CMD", "/opt/pulsar/scripts/docker_entrypoint.sh", "healthcheck-validator"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  validator2:
    <<: *pulsar-image
    command: ["start-validator", "2"]
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - validator2_data:/testnet/.pulsar-node2
    ports:
      - host_ip: "${PULSAR_BIND_HOST:-127.0.0.1}"
        target: 26657
        published: "${VALIDATOR2_HOST_RPC_PORT:-26667}"
        protocol: tcp
      - host_ip: "${PULSAR_BIND_HOST:-127.0.0.1}"
        target: 1317
        published: "${VALIDATOR2_HOST_API_PORT:-1318}"
        protocol: tcp
      - host_ip: "${PULSAR_BIND_HOST:-127.0.0.1}"
        target: 9090
        published: "${VALIDATOR2_HOST_GRPC_PORT:-9091}"
        protocol: tcp
      - host_ip: "${PULSAR_BIND_HOST:-127.0.0.1}"
        target: 6060
        published: "${VALIDATOR2_HOST_PPROF_PORT:-6061}"
        protocol: tcp
    healthcheck:
      test: ["CMD", "/opt/pulsar/scripts/docker_entrypoint.sh", "healthcheck-validator"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  validator3:
    <<: *pulsar-image
    command: ["start-validator", "3"]
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - validator3_data:/testnet/.pulsar-node3
    ports:
      - host_ip: "${PULSAR_BIND_HOST:-127.0.0.1}"
        target: 26657
        published: "${VALIDATOR3_HOST_RPC_PORT:-26677}"
        protocol: tcp
      - host_ip: "${PULSAR_BIND_HOST:-127.0.0.1}"
        target: 1317
        published: "${VALIDATOR3_HOST_API_PORT:-1319}"
        protocol: tcp
      - host_ip: "${PULSAR_BIND_HOST:-127.0.0.1}"
        target: 9090
        published: "${VALIDATOR3_HOST_GRPC_PORT:-9092}"
        protocol: tcp
      - host_ip: "${PULSAR_BIND_HOST:-127.0.0.1}"
        target: 6060
        published: "${VALIDATOR3_HOST_PPROF_PORT:-6062}"
        protocol: tcp
    healthcheck:
      test: ["CMD", "/opt/pulsar/scripts/docker_entrypoint.sh", "healthcheck-validator"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  validator1_data:
  validator2_data:
  validator3_data:
